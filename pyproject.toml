[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-pinn"
version = "0.2.0"
description = "Boundary-adapted neural networks for elliptic PDEs"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["ipykernel>=6", "nbclient>=0.10", "nbformat>=5", "pytest>=8"]
notebooks = ["scikit-fem>=11,<13"]

[project.scripts]
boundary-pinn = "boundary_pinn.cli:main"
periodic-committor = "boundary_pinn.experiments.committor.periodic_two_well.comparison:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["boundary_pinn*"]
