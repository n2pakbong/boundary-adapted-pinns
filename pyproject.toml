[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "met-pinn"
version = "0.1.0"
description = "Reproducible PINN experiments for elliptic first-passage boundary-value problems"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
met-pinn = "met_pinn.cli:main"
met-pinn-periodic-comparison = "met_pinn.periodic_comparison:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["met_pinn*"]
